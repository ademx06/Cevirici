<body class="home-body">
  <div class="app home">
    <header class="home-top">
      <div class="home-brand">
        <span class="home-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 6h10a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3H9l-4 3v-3a3 3 0 0 1-1-2.2V9a3 3 0 0 1 0-3z"/><path d="M8 10h5M8 13h3"/></svg>
        </span>
        <span>Sesli Çevirmen</span>
      </div>
      <span class="home-streak hidden" id="homeStreak"></span>
    </header>

    <h1 class="home-hello" id="homeGreeting">Merhaba!</h1>

    <a href="education.html" class="hero hero-edu">
      <span class="live-badge"><i></i>CANLI SES</span>
      <svg class="hero-art" viewBox="0 0 220 150" aria-hidden="true">
        <rect x="18" y="20" width="118" height="54" rx="22" fill="#fff" opacity=".95"/>
        <path d="M44 74l-6 20 22-20z" fill="#fff" opacity=".95"/>
        <text x="77" y="54" text-anchor="middle" font-size="22" font-weight="800" fill="#17604F" font-family="-apple-system,Segoe UI,sans-serif">Hello!</text>
        <rect x="92" y="72" width="112" height="50" rx="20" fill="#E2A33A"/>
        <path d="M178 122l8 18-22-18z" fill="#E2A33A"/>
        <text x="148" y="104" text-anchor="middle" font-size="19" font-weight="800" fill="#3B2600" font-family="-apple-system,Segoe UI,sans-serif">Merhaba!</text>
        <g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"><path d="M160 26v18M172 18v34M184 26v18M196 32v6"/></g>
      </svg>
      <span class="hero-kicker">Eğitim</span>
      <strong class="hero-title">Öğretmenle<br>sesli konuş</strong>
      <span class="hero-cta" id="eduContinue">Derse başla</span>
    </a>

    <a href="live-talk.html" class="hero hero-talk">
      <span class="live-badge"><i></i>CANLI</span>
      <svg class="hero-art small" viewBox="0 0 160 110" aria-hidden="true">
        <circle cx="40" cy="55" r="30" fill="#fff" opacity=".22"/><circle cx="120" cy="55" r="30" fill="#fff" opacity=".22"/>
        <text x="40" y="66" text-anchor="middle" font-size="30">🇹🇷</text><text x="120" y="66" text-anchor="middle" font-size="30">🇬🇧</text>
        <path d="M70 46h20l-5-5M90 64H70l5 5" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="hero-kicker">Tercüman</span>
      <strong class="hero-title">Konuşurken<br>anında çevir</strong>
    </a>

    <nav class="tiles" aria-label="Bölümler">
      <a href="translate.html" class="tile tile-blue">
        <span class="tile-ic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
        <strong>Çeviri</strong>
      </a>
      <a href="sentence-builder.html" class="tile tile-violet">
        <span class="tile-ic"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l8.5-8.5a2.1 2.1 0 0 1 3 3L9 18H6z"/></svg></span>
        <strong>Cümle Kur</strong>
      </a>
      <a href="self-test.html" class="tile tile-rose">
        <span class="tile-ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg></span>
        <strong>Test Et</strong>
      </a>
    </nav>
    <a href="camera.html" class="tile tile-teal tile-wide">
      <span class="tile-ic"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      <strong>Kamera çeviri</strong>

    <footer class="home-foot">
      <div id="appVersionBar" class="app-version-bar" aria-live="polite">
        <span id="appVersionText"></span>
        <button type="button" id="appUpdateBtn" class="app-update-btn hidden">Güncelle</button>
      </div>
    </footer>
  </div>
  <script src="api-client.js?v=7"></script>
  <script src="keepalive.js?v=2"></script>
  <script src="app-version.js?v=3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try { AppVersion.init(); } catch (e) { /* ignore */ }
      try {
        const h = new Date().getHours();
        document.getElementById('homeGreeting').textContent =
          h < 6 ? 'İyi geceler 🌙' : h < 12 ? 'Günaydın ☀️' : h < 18 ? 'İyi günler 👋' : 'İyi akşamlar 🌆';
        const p = JSON.parse(localStorage.getItem('edu_v3_profile') || 'null');
        const names = { en: 'İngilizce', de: 'Almanca', fr: 'Fransızca', es: 'İspanyolca', it: 'İtalyanca', ru: 'Rusça', ar: 'Arapça', zh: 'Çince', ka: 'Gürcüce', id: 'Endonezce' };
        if (p && p.lang) {
          const lv = (p.levels && p.levels[p.lang]) || 'A1';
          document.getElementById('eduContinue').textContent = `${names[p.lang] || ''} · ${lv} — devam et`;
          if (p.streak > 0) {
            const el = document.getElementById('homeStreak');
            el.textContent = `🔥 ${p.streak} gün`;
            el.classList.remove('hidden');
          }
        }
      } catch (e) { /* ignore */ }
    });
  </script>
</body>
</html>
