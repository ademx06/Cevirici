# Cloudflare Named Tunnel — örnek config
# 1) cloudflare-tunnel.example.yml → cloudflare-tunnel.yml kopyalayın
# 2) tunnel adı, credentials-file ve hostname'i kendi bilgilerinizle doldurun
# 3) docs/SABIT-ADRES.md adımlarını izleyin
#
# tunnel: sesli-cevirmen
# credentials-file: /path/to/.cloudflared/UUID.json

tunnel: sesli-cevirmen
credentials-file: /home/user/.cloudflared/TUNNEL-UUID.json

ingress:
  - hostname: ceviri.sizin-domain.com
    service: http://127.0.0.1:8780
  - service: http_status:404
