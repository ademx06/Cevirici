<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sesli Çevirmen">
  <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Çeviri — Sesli Çevirmen</title>
  <link rel="stylesheet" href="styles.css?v=113">
</head>
<body class="shell">
  <div class="app">
    <header class="header">
      <div class="header-left">
        <a href="/" class="back-btn" aria-label="Ana menü">←</a>
        <div>
          <h1>Çeviri</h1>
          <p class="tagline"><span class="live-dot"></span> Canlı · konuşurken çevirir</p>
        </div>
      </div>
      <button id="clearBtn" class="ghost-btn hidden" type="button">Temizle</button>
    </header>

    <section class="lang-card">
      <div class="lang-field">
        <label for="myLang">Benim dilim</label>
        <select id="myLang"></select>
      </div>
      <button id="swapBtn" class="swap-btn" type="button" aria-label="Dilleri değiştir">⇄</button>
      <div class="lang-field">
        <label for="otherLang">Karşı taraf</label>
        <select id="otherLang"></select>
      </div>
    </section>

    <div class="status-bar">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">Basılı tut ve konuş</span>
    </div>

    <div id="errorBox" class="error-box hidden"></div>

    <div id="interimBox" class="interim hidden">
      <div class="interim-label">Dinleniyor</div>
      <div id="interimText"></div>
    </div>

    <main id="messages" class="messages scroll">
      <div class="empty-state">
        <div class="empty-icon"></div>
        <h2>Basılı tut ve konuş</h2>
        <p>Düğmeye basılı tut, konuş, bırak — çeviri ve okunuşu hemen gelir.</p>
      </div>
    </main>

    <section class="controls">
      <div class="text-input-row">
        <input id="translateTextInput" type="text" enterkeyhint="send" autocomplete="off"
               placeholder="Ya da buraya yaz…" class="translate-text-input" />
        <button id="translateSendBtn" class="translate-send-btn" type="button" aria-label="Çevir">➤</button>
      </div>
      <p id="conversationSubtitle" class="dual-mic-hint">Hangi dilde konuşacaksan o düğmeye bas</p>
      <div class="dual-mic-row" role="group" aria-label="Konuşma dilleri">
        <button id="micBtnMy" class="mic-btn dual-mic" type="button" data-side="my">
          <span class="mic-icon"></span>
          <span class="mic-text">
            <strong id="micTitleMy">Türkçe</strong>
            <small id="micActionMy">Basılı tut</small>
          </span>
        </button>
        <button id="micBtnOther" class="mic-btn dual-mic" type="button" data-side="other">
          <span class="mic-icon"></span>
          <span class="mic-text">
            <strong id="micTitleOther">English</strong>
            <small id="micActionOther">Hold to speak</small>
          </span>
        </button>
      </div>
    </section>
  </div>

  <script src="keepalive.js?v=2"></script>
  <script src="live-audio.js?v=3"></script>
  <script src="live-translate.js?v=3"></script>
</body>
</html>
