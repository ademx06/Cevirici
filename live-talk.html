<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sesli Çevirmen">
  <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121311" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <title>Karşılıklı Konuşma — Sesli Çevirmen</title>
  <link rel="stylesheet" href="styles.css?v=113">
</head>
<body class="live-talk-page shell">
  <div class="app live-talk-app">
    <header class="header">
      <div class="header-left">
        <a href="/" class="back-btn" aria-label="Ana menü">←</a>
        <div>
          <h1>Karşılıklı Konuşma</h1>
          <p class="tagline"><span class="live-dot"></span> Canlı tercüman · eller serbest</p>
        </div>
      </div>
      <button id="ltClearBtn" class="ghost-btn hidden" type="button">Temizle</button>
    </header>

    <section class="live-talk-lang-bar" aria-label="Dil seçimi">
      <div class="live-talk-lang-field">
        <label for="ltMyLang">Ben</label>
        <select id="ltMyLang"></select>
      </div>
      <button id="ltSwapBtn" class="swap-btn" type="button" aria-label="Dilleri değiştir">⇄</button>
      <div class="live-talk-lang-field">
        <label for="ltOtherLang">Karşı taraf</label>
        <select id="ltOtherLang"></select>
      </div>
    </section>

    <div id="ltErrorBox" class="error-box hidden"></div>

    <main id="ltMessages" class="messages live-talk-messages scroll" aria-live="polite"></main>

    <section class="talk-dock">
      <div class="status-bar talk-status">
        <span id="ltStatusDot" class="status-dot"></span>
        <span id="ltStatusText">Başlat'a bas, sırayla konuşun</span>
      </div>
      <button id="ltToggle" class="talk-toggle" type="button">
        <span class="mic-icon"><span class="talk-ring" id="ltMeter" aria-hidden="true"></span></span>
        <span class="talk-label"><strong id="ltToggleText">Başlat</strong><small id="ltPair">🇹🇷 Türkçe ⇄ 🇬🇧 English</small></span>
      </button>
    </section>
  </div>

  <script src="keepalive.js?v=2"></script>
  <script src="live-audio.js?v=11"></script>
  <script src="app-version.js?v=3"></script>
  <script src="live-translate.js?v=12"></script>
</body>
</html>
