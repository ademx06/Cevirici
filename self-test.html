<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060B18">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Kendini Test Et — Sesli Çevirmen</title>
  <link rel="stylesheet" href="styles.css?v=56">
</head>
<body>
  <div class="app mod-app quiz-app">
    <header class="header mod-header">
      <div class="header-left">
        <a href="/" class="back-btn" aria-label="Ana menü">←</a>
        <div>
          <h1>Kendini Test Et</h1>
          <p class="tagline" id="langLabel">🇬🇧 English</p>
        </div>
      </div>
      <a href="sentence-builder.html" class="ghost-btn mod-link-btn">📝 Kur</a>
    </header>

    <section class="lang-card mod-lang-card">
      <div class="lang-field lang-field-full">
        <label for="learnLang">Hedef dil</label>
        <select id="learnLang"></select>
      </div>
    </section>

    <nav class="mod-tabs">
      <button type="button" class="mod-tab active" data-tab="word">Kelime</button>
      <button type="button" class="mod-tab" data-tab="sentence">Cümle</button>
    </nav>

    <main class="mod-scroll quiz-scroll" id="modScroll">
      <section id="quizSetup" class="mod-setup-card">
        <h2>Test ayarları</h2>
        <div class="mod-chip-row">
          <button type="button" class="chip mod-chip active" data-count="10">10 soru</button>
          <button type="button" class="chip mod-chip" data-count="20">20 soru</button>
          <button type="button" class="chip mod-chip" data-count="30">30 soru</button>
        </div>
        <label class="mod-check-label">
          <input type="checkbox" id="hardOnly"> Sadece zorlandıklarım
        </label>
        <button id="startQuizBtn" class="mod-action-btn mod-action-gold" type="button">Teste Başla</button>
        <p id="quizEmptyHint" class="mod-empty hidden">Henüz kayıt yok. <a href="sentence-builder.html">Cümle Kur</a> ile kelime/cümle ekle.</p>
      </section>

      <section id="quizActive" class="hidden">
        <div class="mod-quiz-meta">
          <span id="quizProgress">1 / 10</span>
          <span id="quizModeLabel">Kelime testi</span>
        </div>
        <div id="quizPrompt" class="mod-quiz-prompt"></div>
        <div id="quizResult" class="mod-result-card hidden"></div>
        <div class="mod-quiz-actions hidden" id="quizActions">
          <button type="button" id="retryBtn" class="ghost-btn">🔄 Tekrar Dene</button>
          <button type="button" id="listenCorrectBtn" class="ghost-btn">🔊 Doğru telaffuz</button>
          <button type="button" id="nextBtn" class="mod-action-btn">➡️ Sonraki</button>
        </div>
      </section>

      <section class="mod-saved">
        <h2>İlerleme özeti</h2>
        <div id="savedSummary" class="mod-saved-list"></div>
      </section>
    </main>

    <footer class="mod-dock mod-dock-quiz hidden" id="quizDock">
      <div class="status-bar mod-status">
        <span id="quizStatusDot" class="status-dot"></span>
        <span id="quizStatus">Basılı tut ve hedef dilde konuş</span>
      </div>
      <button id="micBtn" class="mic-btn mic-btn-mod" type="button">
        <span class="mic-icon">🎤</span>
        <span class="mic-text">
          <strong id="micTitle">Basılı Tut ve Konuş</strong>
          <small id="micSubtitle">Hedef dilde cevap ver</small>
        </span>
      </button>
    </footer>
  </div>

  <script src="api-client.js?v=3"></script>
  <script src="keepalive.js?v=2"></script>
  <script src="mic-hold.js?v=3"></script>
  <script src="learn-storage.js?v=2"></script>
  <script src="self-test.js?v=3"></script>
</body>
</html>
