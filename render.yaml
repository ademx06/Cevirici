# Render Blueprint — GitHub repo bağlandıktan sonra "New Blueprint" ile kurulur.
# https://dashboard.render.com/blueprints

services:
  - type: web
    name: sesli-cevirmen
    runtime: docker
    plan: free
    healthCheckPath: /api/ping
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WHISPER_MODEL
        value: tiny
      - key: DISABLE_WHISPER
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_WORD_LESSON_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_TRANSLATE_MODEL
        value: llama-3.1-8b-instant
      - key: WORD_LESSON_PROVIDER
        value: groq
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: TELEGRAM_NOTIFY_ON_START
        value: "0"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: RENDER_DEPLOY_HOOK
        sync: false

  # Sunucuyu uyku moduna girmekten korur — 3 dk'da bir ping
  - type: cron
    name: sesli-cevirmen-keepalive
    runtime: image
    plan: free
    schedule: "*/3 * * * *"
    image:
      url: curlimages/curl:8.5.0
    dockerCommand: curl -fsS --max-time 25 https://sesli-cevirmen.onrender.com/api/ping
